{% extends "base.html" %}

{% block content %}
<style>
  .court-payment-shell { max-width: 720px; margin: 0 auto; }
  .court-payment-head { display: grid; gap: 14px; margin-bottom: 20px; }
  .court-payment-head h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); }
  .court-payment-month { font-size: 18px; font-weight: 700; }
  .court-payment-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .court-payment-actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 9px; background: #fff; color: #1e293b; text-decoration: none; font-weight: 700; }
  .court-payment-actions .pdf { background: #17365d; border-color: #17365d; color: #fff; }
  .court-payment-list { display: grid; gap: 12px; }
  .court-payment-item { padding: 16px; border: 1px solid #dbe3ec; border-radius: 12px; background: #fff; box-shadow: 0 3px 12px rgba(15, 23, 42, .05); }
  .court-payment-date { margin-bottom: 5px; font-weight: 700; }
  .court-payment-number { font-size: 18px; font-weight: 800; }
  .court-payment-number.missing { color: #9a6700; font-size: 16px; font-weight: 700; }
  .court-payment-booker { margin-top: 3px; }
  .court-payment-empty { padding: 24px; border-radius: 12px; background: #f8fafc; color: #64748b; text-align: center; }
</style>

<section class="court-payment-shell">
  <header class="court-payment-head">
    <h1>{{ title }}</h1>
    <div class="court-payment-month">対象月：{{ selected_year }}年{{ selected_month }}月</div>
    <nav class="court-payment-actions" aria-label="対象月と出力操作">
      <a href="{{ previous_url }}">前月</a>
      <a href="{{ next_url }}">翌月</a>
      <a href="{% url 'club:lesson_calendar' %}">レッスンカレンダーへ戻る</a>
      <a class="pdf" href="{{ pdf_url }}">PDFで出力</a>
    </nav>
  </header>

  <div class="court-payment-list">
    {% for row in rows %}
      <article class="court-payment-item">
        <div class="court-payment-date">{{ row.date_time }}</div>
        <div class="court-payment-number{% if row.reservation_number_missing %} missing{% endif %}">予約番号：{{ row.reservation_number }}</div>
        <div class="court-payment-booker">予約者：{{ row.booker }}</div>
      </article>
    {% empty %}
      <div class="court-payment-empty">対象の開催回はありません。</div>
    {% endfor %}
  </div>
</section>
{% endblock %}
